<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>Audio Player - 3 Songs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      padding-top: 60px;
    }
    .player-container {
      background: #ffffff;
      padding: 25px;
      border: 1px solid #cccccc;
      width: 340px;
      margin: 0 auto;
    }
    h3 {
      color: #333333;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .track {
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="player-container">
    
    <!-- Song 1 -->
    <div class="track">
      <h3>Hamari Adhuri Kahani (Title Track)</h3>
      <audio controls preload="none">
        <source src="https://hindi1.djpunjab.app/load-hindi/ksaDuuYxgT7htBH-wcWDRA==/Hamari%20Adhuri%20Kahani%20(Title%20Track)%20From%20Hamari%20Adhuri%20Kahani.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>

    <!-- Song 2 -->
    <div class="track">
      <h3>Samjhawan - Humpty Sharma Ki Dulhania</h3>
      <audio controls preload="none">
        <source src="https://hzarts98.github.io/Samjhawan%20Humpty%20Sharma%20Ki%20Dulhania%20128%20Kbps%20(2).mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>

    <!-- Song 3 -->
    <div class="track">
      <h3>Agar Tum Saath Ho - Tamasha</h3>
      <audio controls preload="none">
        <source src="https://hzarts98.github.io/Agar%20Tum%20Saath%20Ho%20Tamasha%20128%20Kbps.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>

  </div>

</body>
</html>
